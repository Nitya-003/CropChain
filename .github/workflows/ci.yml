name: CropChain CI/CD & Security Audit

# Triggers: Push to main branch and Pull Requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Global environment variables
env:
  NODE_ENV: test
  CI: true

jobs:
  # Job 1: Smart Contract Tests
  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smart-contracts/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      # Step 4: Run Hardhat tests
      - name: Run Smart Contract Tests
        working-directory: smart-contracts/
        run: npm run test:ci

      # Step 5: Compile contracts (additional verification)
      - name: Compile Smart Contracts
        working-directory: smart-contracts/
        run: npx hardhat compile

  # Job 2: Smart Contract Security Audit
  smart-contract-security-audit:
    name: Smart Contract Security Audit
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smart-contracts/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      # Step 4: Run Slither Security Analysis
      - name: Run Slither Security Analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: "smart-contracts/contracts/"
          fail-on: all
          slither-args: '--filter-paths "smart-contracts/contracts/lib/openzeppelin/**" --exclude naming-convention,external-function,low-level-calls,assembly,constable-states'

  # Job 3: Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend/
        run: npm ci --legacy-peer-deps

      # Step 4: Run backend tests
      - name: Run Backend Tests
        working-directory: backend/
        run: npm run test:ci

  # Job 4: Frontend Build Check
  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      # Step 4: Build frontend (TypeScript compilation check)
      - name: Build Frontend
        working-directory: frontend/
        run: npm run build

  # Job 5: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      # Step 4: Run frontend tests
      - name: Run Frontend Tests
        working-directory: frontend/
        run: npm run test:ci

  # Job 6: Terraform Validation
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/
  # Job 6: Docker Security Scan
  docker-security-scan:
    name: Trivy Scan (${{ matrix.service.name }})
    runs-on: ubuntu-latest
  # Job 6: Publish Docker Images
  docker-publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, smart-contract-tests, smart-contract-security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend/
            dockerfile: backend/Dockerfile.dev
          - name: frontend
            context: frontend/
            dockerfile: frontend/Dockerfile.dev
          - name: ml-service
            context: ml-service/
            dockerfile: ml-service/Dockerfile
  # Job 6: SBOM Generation
  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
  # Job 6: ML Service Checks
  ml-service-checks:
    name: ML Service Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
      - name: Build Image
        run: docker build -t cropchain/${{ matrix.service.name }}:latest -f ${{ matrix.service.dockerfile }} ${{ matrix.service.context }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cropchain/${{ matrix.service.name }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.service.name }}
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: cropchain-sbom.spdx.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        working-directory: ml-service/
        run: pip install -r requirements.txt

      - name: Validate ML Service
        working-directory: ml-service/
        run: python -m py_compile app.py train.py

  # Job 7: Docker Validation
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
