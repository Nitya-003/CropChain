name: CropChain CI/CD & Security Audit

# Triggers: Push to main branch and Pull Requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Global environment variables
env:
  NODE_ENV: test
  CI: true

jobs:
  # Job 1: Smart Contract Tests
  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Smart Contracts)
        id: cache-sc-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-sc-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-sc-

      - name: Install dependencies
        if: steps.cache-sc-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      - name: Run Smart Contract Tests
        working-directory: smart-contracts/
        run: npm run test:ci

      - name: Compile Smart Contracts
        working-directory: smart-contracts/
        run: npx hardhat compile

  # Job 2: Smart Contract Security Audit
  smart-contract-security-audit:
    name: Smart Contract Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Smart Contracts)
        id: cache-sc-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-sc-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-sc-

      - name: Install dependencies
        if: steps.cache-sc-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      - name: Run Slither Security Analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: "smart-contracts/contracts/"
          fail-on: none
          slither-args: '--filter-paths "smart-contracts/contracts/lib/openzeppelin/**" --exclude naming-convention,external-function,low-level-calls,assembly,constable-states'

  # Job 3: Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Backend)
        id: cache-backend-node-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install backend dependencies
        if: steps.cache-backend-node-modules.outputs.cache-hit != 'true'
        working-directory: backend/
        run: npm ci --legacy-peer-deps

      - name: Run Backend Tests
        working-directory: backend/
        run: npm run test:ci

  # Job 4: Frontend Build Check
  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Frontend)
        id: cache-frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install frontend dependencies
        if: steps.cache-frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: frontend/
        run: npm run build

  # Job 5: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Frontend)
        id: cache-frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install frontend dependencies
        if: steps.cache-frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests
        working-directory: frontend/
        run: npm run test:ci

  # Job 6: ML Service Tests
  ml-service-tests:
    name: ML Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ML dependencies
        working-directory: ml-service/
        run: pip install -r requirements.txt
