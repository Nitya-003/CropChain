name: CropChain CI/CD & Security Audit

# Triggers: Push to main branch and Pull Requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Global environment variables
env:
  NODE_ENV: test
  CI: true

jobs:
  # Job 1: Smart Contract Tests
  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Smart Contracts)
        id: cache-sc-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-sc-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-sc-

      - name: Install dependencies
        if: steps.cache-sc-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      - name: Run Smart Contract Tests
        working-directory: smart-contracts/
        run: npm run test:ci

      - name: Compile Smart Contracts
        working-directory: smart-contracts/
        run: npx hardhat compile

  # Job 2: Smart Contract Security Audit
  smart-contract-security-audit:
    name: Smart Contract Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Smart Contracts)
        id: cache-sc-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-sc-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-sc-

      - name: Install dependencies
        if: steps.cache-sc-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      - name: Run Slither Security Analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: "smart-contracts/"
          fail-on: all
          slither-args: >-
            --filter-paths "smart-contracts/contracts/lib/openzeppelin/.*"
            --exclude naming-convention,external-function,low-level-calls,assembly,constable-states

  # Job 3: Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Backend)
        id: cache-backend-node-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install backend dependencies
        if: steps.cache-backend-node-modules.outputs.cache-hit != 'true'
        working-directory: backend/
        run: npm ci --legacy-peer-deps

      - name: Run Backend Tests
        working-directory: backend/
        run: npm run test:ci

  # Job 4: Frontend Build Check
  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Frontend)
        id: cache-frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install frontend dependencies
        if: steps.cache-frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: frontend/
        run: npm run build

  # Job 5: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node Modules (Frontend)
        id: cache-frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install frontend dependencies
        if: steps.cache-frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests
        working-directory: frontend/
        run: npm run test:ci

  # Job 6: ML Service Tests
  ml-service-tests:
    name: ML Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ML dependencies
        working-directory: ml-service/
        run: pip install -r requirements.txt

      - name: Validate ML Service
        working-directory: ml-service/
        run: python -m py_compile app.py train.py

  # Job 7: Mobile Tests
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile/
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        working-directory: mobile/
        run: npm run test:ci

  # Job 8: Terraform Validation
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Job 9: Docker Security Scan
  docker-security-scan:
    name: Trivy Scan (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend/
            dockerfile: backend/Dockerfile.dev
          - name: frontend
            context: frontend/
            dockerfile: frontend/Dockerfile.dev
          - name: ml-service
            context: ml-service/
            dockerfile: ml-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: cropchain/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cropchain/${{ matrix.service.name }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.service.name }}

  # Job 10: Publish Docker Images
  docker-publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, mobile-tests, smart-contract-tests, smart-contract-security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: backend/
            dockerfile: backend/Dockerfile.dev
          - name: frontend
            context: frontend/
            dockerfile: frontend/Dockerfile.dev
          - name: ml-service
            context: ml-service/
            dockerfile: ml-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job 11: SBOM Generation
  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: cropchain-sbom.spdx.json

  # Job 12: Docker Validation
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
