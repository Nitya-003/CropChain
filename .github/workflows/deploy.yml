name: Deploy to AWS Production

on:
  workflow_run:
    workflows: ["CropChain CI/CD & Security Audit"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application to AWS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write  # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start_time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Deploy Application
        id: deployment
        run: |
          echo "Simulating deployment to staging/production..."
          sleep 2
          # Replace with actual deployment commands
          echo "Deployment successful."

      - name: Run Health Checks
        id: health_checks
        run: |
          echo "Running post-deployment health checks..."
          sleep 2
          # Replace with actual health check commands
          echo "Health checks passed."

      - name: Generate Success Summary
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Deployment Status Summary

          | Information | Details |
          | ----------- | ------- |
          | **Status** | ✅ Successful |
          | **Branch or Tag** | \`${GITHUB_REF_NAME}\` |
          | **Commit** | \`${GITHUB_SHA::7}\` |
          | **Duration** | ${MINUTES}m ${SECONDS}s |
          | **Health Checks** | ✅ Passed |
          EOF

      - name: Generate Failure Summary
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚨 Deployment Status Summary

          | Information | Details |
          | ----------- | ------- |
          | **Status** | ❌ Failed |
          | **Branch or Tag** | \`${GITHUB_REF_NAME}\` |
          | **Commit** | \`${GITHUB_SHA::7}\` |
          | **Duration** | ${MINUTES}m ${SECONDS}s |
          | **Health Checks** | ❌ Failed |
          | **Failure Details** | Deployment or post-deployment health verification encountered an error. |
          EOF
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Make deployment script executable
        run: chmod +x deploy-aws.sh

      - name: Run AWS Deployment Script
        env:
          CI: "true"
          ETH_PRIVATE_KEY: ${{ secrets.ETH_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MULTISIG_HMAC_SECRET: ${{ secrets.MULTISIG_HMAC_SECRET }}
          ML_API_KEY: ${{ secrets.ML_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: ./deploy-aws.sh

      - name: Post-Deployment Health Check
        run: |
          echo "Fetching EC2 Public IP from CloudFormation..."
          QUERY="Stacks[0].Outputs[?OutputKey=='EC2PublicIP'].OutputValue"
          EC2_PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name cropchain-infra \
            --query "$QUERY" --output text)

          if [ -z "$EC2_PUBLIC_IP" ] || [ "$EC2_PUBLIC_IP" == "None" ]; then
            echo "Failed to retrieve EC2 Public IP."
            exit 1
          fi

          echo "Checking Backend Health Endpoint: http://$EC2_PUBLIC_IP:3001/api/health"

          # Wait up to 120 seconds for the service to become responsive (retry every 10 seconds)
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$EC2_PUBLIC_IP:3001/api/health || true)
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "✅ Health check passed! Application is responsive."
              exit 0
            fi
            echo "Attempt $i: Application not yet ready (HTTP $HTTP_STATUS). Waiting 10 seconds..."
            sleep 10
          done

          echo "❌ Health check failed after 120 seconds."
          exit 1
